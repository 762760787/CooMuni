# Hôte virtuel Nginx — Coopérative du personnel (coop.ngoundiane.sn)
# À copier dans /etc/nginx/sites-available/, puis lien symbolique dans sites-enabled.
# Le HTTPS (bloc 443 + redirection) est ajouté ensuite par : certbot --nginx -d coop.ngoundiane.sn
# Adapter « fastcgi_pass » à la version de PHP-FPM installée (8.3 recommandée).

server {
    listen 80;
    listen [::]:80;
    server_name coop.ngoundiane.sn;

    root /var/www/coop/public;
    index index.php;
    charset utf-8;

    # Photos (2 Mo), justificatifs (5 Mo), envois Livewire (12 Mo max)
    client_max_body_size 12M;

    access_log /var/log/nginx/coop.ngoundiane.sn.access.log;
    error_log  /var/log/nginx/coop.ngoundiane.sn.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Ressources compilées (noms uniques) : cache long
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker de la PWA : toujours revalidé
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # Fichiers cachés (.env, .git…) jamais servis
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
