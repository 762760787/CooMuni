# Hôte virtuel Apache — Coopérative du personnel (coop.ngoundiane.sn)
# À utiliser si le VPS sert ses sites avec Apache (au lieu de Nginx).
# /etc/apache2/sites-available/coop.ngoundiane.sn.conf, puis : a2ensite coop.ngoundiane.sn
# Modules requis : rewrite, headers (et proxy_fcgi si PHP-FPM). HTTPS ensuite : certbot --apache -d coop.ngoundiane.sn

<VirtualHost *:80>
    ServerName coop.ngoundiane.sn
    DocumentRoot /var/www/coop/public

    <Directory /var/www/coop/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Si PHP tourne en PHP-FPM (adapter la version) :
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
    </FilesMatch>

    LimitRequestBody 12582912

    ErrorLog ${APACHE_LOG_DIR}/coop.ngoundiane.sn.error.log
    CustomLog ${APACHE_LOG_DIR}/coop.ngoundiane.sn.access.log combined
</VirtualHost>
